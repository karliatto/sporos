[target.xtensa-esp32-none-elf]
# The bootloader and partition table are the repo's, not espflash's built-in
# ones, so a development flash writes exactly what `make image` ships. Paths
# are relative to firmware/, where cargo runs.
runner = "espflash flash --monitor --chip esp32 --bootloader boot/bootloader.bin --partition-table partitions.csv"

[build]
target = "xtensa-esp32-none-elf"
rustflags = ["-C", "link-arg=-nostartfiles"]

[unstable]
build-std = ["core"]

# Enables the `trim-paths` profile option. Without it the absolute paths of the
# cargo registry and the rustup sysroot end up in `.rodata` (via panic
# locations), so the flashed image differs between machines. See README.
trim-paths = true
